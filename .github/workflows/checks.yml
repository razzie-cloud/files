name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: files_test
          POSTGRES_PASSWORD: files-test-only
          POSTGRES_DB: files_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U files_test" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://files_test:files-test-only@127.0.0.1:5432/files_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t files:test .
