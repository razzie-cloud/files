<header><div><h2 id="connection-dialog-title">Edit connection</h2><p>razcloud</p></div><button type="button" class="secondary outline dialog-close" data-close-connection aria-label="Close dialog">×</button></header><form class="connection-form" hx-get="fragments/connections-saved.html" action="fragments/connections-saved.html" hx-params="none" hx-target="#connection-area"><div class="form-fields"><label for="connection-name">Name</label><input id="connection-name" type="text" value="razcloud" required placeholder="e.g. Personal storage" autocomplete="off"><div class="two-column-form"><div><label for="provider">Provider</label><select id="provider"><option value="Other" selected>Custom S3-compatible</option><option value="Backblaze">Backblaze B2 (S3 API)</option><option value="AWS">Amazon S3</option></select></div><div><label for="region">Signing region</label><input id="region" type="text" value="eu-central-003" placeholder="e.g. eu-central-003" autocomplete="off"></div></div><label for="endpoint">Endpoint</label><input id="endpoint" type="url" value="https://s3.eu-central-003.backblazeb2.com" placeholder="https://s3.example.com" autocomplete="off" aria-describedby="endpoint-help"><small id="endpoint-help">Use your bucket’s regional S3 endpoint. Amazon S3 may leave this blank.</small><label><input id="path-style" type="checkbox" role="switch" checked> Use path-style bucket addressing</label><section class="field-section" aria-labelledby="credentials-title"><h3 id="credentials-title">Credentials</h3><p class="credential-hint">Leave blank to keep saved credentials. Stored values are never displayed.</p><div class="two-column-form"><div><label for="access-key">Access key ID</label><input id="access-key" type="text" value="" autocomplete="off"></div><div><label for="secret-key">Secret key</label><input id="secret-key" type="password" value="" autocomplete="new-password"></div></div><label for="session-token">Session token (optional)</label><input id="session-token" type="password" value="" autocomplete="new-password"><label><input id="clear-session-token" type="checkbox" role="switch"> Clear saved session token</label></section><section class="field-section" aria-labelledby="policy-title"><h3 id="policy-title">Access policy</h3><label for="access-mode">Access mode</label><select id="access-mode"><option value="read_only" selected>Read-only</option><option value="writable">Writable</option></select><p class="credential-hint">Files enforces this policy even if your provider credentials allow more.</p></section><div id="form-feedback" role="status" aria-live="polite"></div><button type="button" class="text-button preview-failure" hx-get="fragments/connection-error.html" hx-target="#form-feedback" hx-params="none">Preview a save error</button></div><div class="form-actions"><button type="button" class="secondary outline" data-close-connection>Cancel</button><button type="submit">Save changes</button></div></form>
